# Smart Money Radar — production stack.
#   cp .env.example .env   (fill DASHBOARD_PASSWORD, SESSION_SECRET, POSTGRES_PASSWORD, DOMAIN ...)
#   docker compose up -d --build
# Every service restarts automatically (also after a server reboot, as long as the Docker
# service is enabled: `systemctl enable docker`).

x-backend: &backend
  build: ./backend
  image: smart-money-radar-backend:1.0
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  healthcheck:   # workers: a heartbeat in the last 5 minutes (the api service overrides this)
    test: ["CMD", "python", "-m", "radar", "healthcheck"]
    interval: 60s
    timeout: 15s
    start_period: 120s
    retries: 3

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 10s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    logging: *logging

  migrate:
    build: ./backend
    image: smart-money-radar-backend:1.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "radar", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "radar", "api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      start_period: 40s

  stream:      { <<: *backend, command: ["python", "-m", "radar", "stream"] }
  verifier:    { <<: *backend, command: ["python", "-m", "radar", "verifier"] }
  sync:        { <<: *backend, command: ["python", "-m", "radar", "sync"] }
  discovery:   { <<: *backend, command: ["python", "-m", "radar", "discovery"] }
  prices:      { <<: *backend, command: ["python", "-m", "radar", "prices"] }
  analytics:   { <<: *backend, command: ["python", "-m", "radar", "analytics"] }
  signals:     { <<: *backend, command: ["python", "-m", "radar", "signals"] }
  winners:     { <<: *backend, command: ["python", "-m", "radar", "winners"] }   # winner-reverse discovery, database only
  callers:     # Telegram Caller Tracker (read-only; public t.me previews; optional Telethon session in a volume)
    <<: *backend
    command: ["python", "-m", "radar", "callers"]
    volumes: ["tg_session:/app/tg_session"]

  frontend:
    build: ./frontend
    image: smart-money-radar-frontend:1.0
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [frontend, api]
    logging: *logging

  backup:
    image: timescale/timescaledb:2.17.2-pg16   # same image as the database: pg_dump/pg_restore 16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-19:30}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./deploy/backup/restore.sh:/restore.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  tg_session:
  redisdata:
  caddydata:
  caddyconfig:
