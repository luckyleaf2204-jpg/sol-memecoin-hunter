# Smart Money Radar — chạy trên máy tính cá nhân (Windows 10/11 + Docker Desktop).
# Không cần VPS, tên miền hay HTTPS. Dashboard: http://localhost:8080
#
#   windows\setup.bat   (lần đầu: tạo .env)      windows\start.bat   (khởi động)
#
# Khác với docker-compose.yml (bản VPS):
#   * mọi worker chạy trong MỘT container "worker" (python -m radar all) để tiết kiệm RAM;
#   * Caddy chỉ phục vụ HTTP trên 127.0.0.1:${LOCAL_PORT:-8080} (không mở ra Internet);
#   * backup chạy bù ngay khi máy bật nếu bản gần nhất đã quá 24 giờ.
# Mọi container có restart: unless-stopped -> tự chạy lại khi Docker Desktop khởi động.
name: smart-money-radar

x-backend: &backend
  build: ./backend
  image: smart-money-radar-backend:1.0
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  healthcheck:   # workers: a heartbeat in the last 5 minutes (the api service overrides this)
    test: ["CMD", "python", "-m", "radar", "healthcheck"]
    interval: 60s
    timeout: 15s
    start_period: 120s
    retries: 3

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua co POSTGRES_PASSWORD trong .env - chay windows\setup.bat}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 10s
      retries: 30
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    logging: *logging

  migrate:
    build: ./backend
    image: smart-money-radar-backend:1.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radar}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "radar", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "radar", "api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      start_period: 40s

  # stream + verifier + sync + discovery + prices + analytics + signals in one process
  worker:
    <<: *backend
    command: ["python", "-m", "radar", "all"]

  frontend:
    build: ./frontend
    image: smart-money-radar-frontend:1.0
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    logging: *logging

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["${LOCAL_BIND:-127.0.0.1}:${LOCAL_PORT:-8080}:80"]
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [frontend, api]
    logging: *logging

  backup:
    image: timescale/timescaledb:2.17.2-pg16   # same image as the database: pg_dump/pg_restore 16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-05:00}
      BACKUP_CATCH_UP: "1"
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./deploy/backup/restore.sh:/restore.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  # Optional: public access through a Cloudflare Tunnel (only started with --profile tunnel,
  # which windows\start.bat adds when CLOUDFLARE_TUNNEL_TOKEN is set in .env).
  # In the Cloudflare dashboard the tunnel's public hostname must point to http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on: [caddy]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
